<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Cart | Item Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">CC</div>
    <div class="brand"><b>Campus Cart</b><small>ITEM MANAGEMENT</small></div>
    <span class="tag">LAB TASK 01</span>
  </header>
  <main class="container">
    <section class="panel">
      <div class="panel-title"><h2 id="form-title">Add Item</h2></div>
      <form id="item-form">
        <input type="hidden" id="item-id">
        <div class="form-grid">
          <div><label for="name">Name</label><input id="name" type="text" placeholder="Enter item name" required></div>
          <div><label for="price">Price (₹)</label><input id="price" type="number" min="0" step="0.01" placeholder="Enter price" required></div>
        </div>
        <div class="actions">
          <button id="submit-button" class="primary" type="submit">Submit</button>
          <button id="cancel-button" class="cancel hidden" type="button">Cancel</button>
        </div>
      </form>
      <p id="message" role="status"></p>
    </section>
    <section class="panel">
      <div class="panel-title table-title"><h2>Items List</h2><span class="count" id="item-count">2 items</span></div>
      <div class="scroll">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Action</th></tr></thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
